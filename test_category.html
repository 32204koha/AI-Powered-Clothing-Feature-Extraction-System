<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>衣服属性抽出・研究用プロトタイプ（サーバー推論版）</title>
    <style>
        body { font-family: sans-serif; padding: 30px; max-width: 550px; margin: 0 auto; background: #fdfdfd; color: #333; }
        .box { border: 2px dashed #ccc; padding: 20px; text-align: center; margin-bottom: 15px; border-radius: 8px; background: #fff; }
        select { width: 100%; padding: 10px; font-size: 16px; margin-bottom: 15px; border-radius: 5px; border: 1px solid #ccc; }
        button { padding: 12px 20px; background: #007BFF; color: white; border: none; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; font-weight: bold; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        img { max-width: 100%; border-radius: 5px; margin-top: 10px; display: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #statusBox { background: #e8f0fe; color: #1967d2; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; display: none; }
        .result-box { background: #f8f9fa; border: 1px solid #e9ecef; padding: 15px; border-radius: 6px; margin-bottom: 15px; text-align: left; }
        .result-box p { margin: 6px 0; font-size: 15px; }
    </style>
</head>
<body>

    <h2>👕 衣服属性抽出・研究用プロトタイプ</h2>
    <div class="box">
        <label for="modelSelect"><b>使用する背景削除AIモデル:</b></label>
        <select id="modelSelect">
            <option value="u2net">u2net (標準・バランス型)</option>
            <option value="u2netp">u2netp (軽量・超高速)</option>
            <option value="isnet-general-use">isnet-general-use (高精度・境界線重視)</option>
            <option value="bria-rmbg">bria-rmbg (EC・商品特化型)</option>
        </select>

        <input type="file" id="imageInput" accept="image/*"><br><br>
        <button id="sendBtn" disabled>サーバーで解析を実行</button>
    </div>

    <div id="statusBox">準備中...</div>

    <!-- 🌟 サーバーからの解析結果表示エリア -->
    <div class="result-box">
        <h3>解析結果（モデル: <span id="currentModelName">u2net</span>）</h3>
        <p>🏷️ <b>カテゴリー:</b> <span id="categoryResult" style="color: #28a745; font-weight: bold;">-</span> （確率: <span id="confidenceResult">-</span>）</p>
        <p style="font-size: 13px; color: #6c757d;">💬 <b>採択プロンプト:</b> <span id="bestPromptResult">-</span></p>
        <hr style="border: 0; border-top: 1px solid #dee2e6; margin: 10px 0;">
        <p>🎨 <b>メインカラー (1位):</b> <span id="colorResult" style="color: #007BFF; font-weight: bold;">-</span></p>
        <p>🥈 <b>サブカラー (2位):</b> <span id="secondColorResult" style="color: #495057; font-weight: bold;">-</span></p>
    </div>

    <img id="resultImg" alt="背景切り抜き結果">

    <script>
        const imageInput = document.getElementById('imageInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusBox = document.getElementById('statusBox');
        const resultImg = document.getElementById('resultImg');
        const modelSelect = document.getElementById('modelSelect');
        const currentModelName = document.getElementById('currentModelName');

        imageInput.addEventListener('change', () => {
            sendBtn.disabled = !imageInput.files[0];
            resultImg.style.display = 'none';
        });

        function compressImage(file, maxWidth, maxHeight, quality) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxWidth) { height = Math.round(height * (maxWidth / width)); width = maxWidth; }
                        } else {
                            if (height > maxHeight) { width = Math.round(width * (maxHeight / height)); height = maxHeight; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        canvas.toBlob((blob) => {
                            resolve(new File([blob], file.name, { type: 'image/jpeg' }));
                        }, 'image/jpeg', quality);
                    };
                };
            });
        }

        sendBtn.addEventListener('click', async () => {
            const originalFile = imageInput.files[0];
            if (!originalFile) return;

            const selectedModel = modelSelect.value;
            currentModelName.textContent = selectedModel;

            sendBtn.disabled = true;
            resultImg.style.display = 'none';
            statusBox.style.display = 'block';

            let seconds = 0;
            statusBox.textContent = `📦 [0秒] 画像圧縮中...`;
            const timer = setInterval(() => {
                seconds++;
                statusBox.textContent = `⏳ [${seconds}秒経過] サーバーでAI推論中...`;
            }, 1000);

            try {
                // 長辺350pxに圧縮してサーバーへ送信
                const compressedFile = await compressImage(originalFile, 350, 350, 0.7);
                
                const formData = new FormData();
                formData.append('file', compressedFile);
                formData.append('model_name', selectedModel);

                const response = await fetch('http://localhost:8000/test-remove-bg', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                clearInterval(timer);

                if (data.status === "success") {
                    statusBox.textContent = `✨ 完了！ (所要時間: ${seconds}秒)`;
                    
                    // 🌟 サーバーからのレスポンスを画面に反映
                    document.getElementById('categoryResult').textContent = data.category;
                    document.getElementById('confidenceResult').textContent = (data.confidence * 100).toFixed(1) + "%";
                    document.getElementById('bestPromptResult').textContent = data.best_prompt;
                    
                    document.getElementById('colorResult').textContent = data.detected_color;
                    document.getElementById('secondColorResult').textContent = data.second_color;
                    
                    resultImg.src = data.image_url + "?t=" + new Date().getTime();
                    resultImg.style.display = 'block';
                } else {
                    statusBox.textContent = `❌ エラー: ${data.message}`;
                }
            } catch (error) {
                clearInterval(timer);
                statusBox.textContent = `❌ 通信エラー: ${error.message}`;
            } finally {
                sendBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
